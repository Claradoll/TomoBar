name: Build and release
on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'build.ps1'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tomobar-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build, test, and package
        shell: pwsh
        run: ./build.ps1 -Test -Package
      - name: Publish version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $info = (Get-Item './dist/TomoBar.exe').VersionInfo
          $version = '{0}.{1}.{2}' -f $info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $tag already exists; published files are left unchanged."
            exit 0
          }
          gh release create $tag "./dist/TomoBar-$version-win-x64.zip" './dist/TomoBar.exe' './dist/SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "TomoBar $tag · 小番茄" --notes-file './docs/RELEASE_NOTES.md' --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
